<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="sqJwstGal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7aa"/>
      <stop offset="40%" stop-color="#df6d2d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#050b17" stop-opacity="0"/>
    </radialGradient>
    <filter id="sqShock"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="800" height="500" fill="#040914"/>
  <!-- Deep infrared background galaxies -->
  <g fill="#ffae70" opacity="0.5">
    <ellipse cx="90" cy="90" rx="8" ry="3" transform="rotate(20 90 90)"/>
    <ellipse cx="705" cy="390" rx="10" ry="3.5" transform="rotate(-30 705 390)"/>
    <circle cx="140" cy="420" r="1.6"/><circle cx="680" cy="80" r="1.8"/><circle cx="755" cy="230" r="1.4"/>
  </g>
  <!-- Sweeping red-gold supersonic shockwave between colliding galaxies -->
  <path d="M355,180 C395,220 400,275 430,335" fill="none" stroke="#ff5238" stroke-width="18" opacity="0.55" filter="url(#sqShock)"/>
  <ellipse cx="220" cy="310" rx="75" ry="42" transform="rotate(-25 220 310)" fill="url(#sqJwstGal)"/>
  <ellipse cx="410" cy="220" rx="84" ry="48" transform="rotate(15 410 220)" fill="url(#sqJwstGal)"/>
  <ellipse cx="445" cy="295" rx="64" ry="36" transform="rotate(-12 445 295)" fill="url(#sqJwstGal)"/>
  <ellipse cx="590" cy="145" rx="72" ry="38" transform="rotate(35 590 145)" fill="url(#sqJwstGal)"/>
  <ellipse cx="350" cy="115" rx="58" ry="28" transform="rotate(-40 350 115)" fill="#84b8ff" opacity="0.65"/>
  <!-- Blazing Active Galactic Nucleus (top galaxy NGC 7319) with 6-point spikes -->
  <g stroke="#fff3cf" stroke-width="1.4">
    <g transform="translate(590,145)">
      <line x1="0" y1="-22" x2="0" y2="22"/><line x1="-19" y1="-11" x2="19" y2="11"/><line x1="-19" y1="11" x2="19" y2="-11"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="none"/>
    </g>
  </g>
  <g fill="#fff2cc">
    <circle cx="220" cy="310" r="4.5"/><circle cx="410" cy="220" r="5.5"/><circle cx="445" cy="295" r="4.5"/>
    <circle cx="350" cy="115" r="4"/>
  </g>
</svg>
