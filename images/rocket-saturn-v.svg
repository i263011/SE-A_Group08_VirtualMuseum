<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010814"/>
      <stop offset="65%" stop-color="#041E42"/>
      <stop offset="100%" stop-color="#173561"/>
    </linearGradient>
    <linearGradient id="bodyCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8bec9"/>
      <stop offset="35%" stop-color="#f5f7fa"/>
      <stop offset="75%" stop-color="#d5dbe3"/>
      <stop offset="100%" stop-color="#7d8796"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <g fill="#f0cb90" opacity="0.65"><circle cx="65" cy="80" r="1.4"/><circle cx="330" cy="65" r="1.6"/><circle cx="88" cy="210" r="1.2"/><circle cx="315" cy="260" r="1.3"/></g>
  <!-- Launchpad Baseline -->
  <rect x="0" y="545" width="400" height="55" fill="#081326"/>
  <line x1="0" y1="545" x2="400" y2="545" stroke="#BC9E70" stroke-width="2"/>
  <!-- Launch Escape System Tower -->
  <rect x="197" y="42" width="6" height="44" fill="#e5e9f0"/>
  <polygon points="200,28 193,44 207,44" fill="#d0d6e0"/>
  <!-- Apollo CSM & SLA -->
  <polygon points="190,86 210,86 216,115 184,115" fill="url(#bodyCyl)"/>
  <polygon points="184,115 216,115 224,158 176,158" fill="url(#bodyCyl)"/>
  <!-- S-IVB Third Stage -->
  <rect x="176" y="158" width="48" height="82" fill="url(#bodyCyl)"/>
  <rect x="176" y="218" width="48" height="22" fill="#18202c"/>
  <!-- Interstage Taper to S-II -->
  <polygon points="176,240 224,240 236,272 164,272" fill="#18202c"/>
  <!-- S-II Second Stage -->
  <rect x="164" y="272" width="72" height="118" fill="url(#bodyCyl)"/>
  <rect x="164" y="365" width="72" height="25" fill="#18202c"/>
  <!-- S-IC First Stage -->
  <rect x="164" y="390" width="72" height="130" fill="url(#bodyCyl)"/>
  <rect x="164" y="458" width="22" height="62" fill="#18202c"/>
  <rect x="214" y="458" width="22" height="62" fill="#18202c"/>
  <!-- USA Red Marking -->
  <rect x="191" y="410" width="18" height="7" rx="1" fill="#b3392b"/>
  <!-- Fins -->
  <polygon points="164,492 146,522 164,522" fill="#232c3b"/>
  <polygon points="236,492 254,522 236,522" fill="#232c3b"/>
  <!-- 5 F-1 Engine Bells -->
  <g fill="#454d59" stroke="#9aa3b2" stroke-width="1">
    <polygon points="166,520 178,520 182,542 162,542"/>
    <polygon points="184,520 196,520 200,542 180,542"/>
    <polygon points="204,520 216,520 220,542 200,542"/>
    <polygon points="222,520 234,520 238,542 218,542"/>
  </g>
</svg>
