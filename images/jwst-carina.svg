<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cJwstSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="55%" stop-color="#13345e"/>
      <stop offset="100%" stop-color="#2c537a"/>
    </linearGradient>
    <linearGradient id="cJwstCliff" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#f7b46b"/>
      <stop offset="22%" stop-color="#cc6f2c"/>
      <stop offset="65%" stop-color="#6e2e16"/>
      <stop offset="100%" stop-color="#26110e"/>
    </linearGradient>
    <filter id="cGlow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#cJwstSky)"/>
  <!-- Translucent steam rising off cosmic mountain ridge -->
  <path d="M120,255 Q240,160 390,215 T690,175 L800,250 L0,300 Z" fill="#70b5eb" opacity="0.22" filter="url(#cGlow)"/>
  <!-- Hundreds of sharp infrared stars -->
  <g fill="#fff0d6">
    <circle cx="48" cy="35" r="1.4"/><circle cx="112" cy="82" r="1.1"/><circle cx="165" cy="40" r="1.7"/>
    <circle cx="228" cy="70" r="1.3"/><circle cx="290" cy="30" r="1.5"/><circle cx="348" cy="95" r="1.2"/>
    <circle cx="412" cy="45" r="1.8"/><circle cx="470" cy="82" r="1.3"/><circle cx="525" cy="38" r="1.6"/>
    <circle cx="592" cy="74" r="1.2"/><circle cx="655" cy="44" r="1.9"/><circle cx="732" cy="84" r="1.5"/>
    <circle cx="78" cy="145" r="1.3"/><circle cx="145" cy="185" r="1.6"/><circle cx="255" cy="138" r="1.2"/>
    <circle cx="318" cy="175" r="1.4"/><circle cx="445" cy="135" r="1.7"/><circle cx="560" cy="128" r="1.3"/>
    <circle cx="695" cy="132" r="1.6"/><circle cx="765" cy="148" r="1.2"/>
  </g>
  <!-- Crisp Glowing Copper & Amber Cosmic Cliffs -->
  <path d="M0,330 C95,295 160,240 245,270 C315,295 365,215 445,235 C525,255 585,175 680,210 C740,232 775,205 800,195 L800,500 L0,500 Z" fill="url(#cJwstCliff)"/>
  <path d="M0,330 C95,295 160,240 245,270 C315,295 365,215 445,235 C525,255 585,175 680,210 C740,232 775,205 800,195" fill="none" stroke="#ffd89c" stroke-width="3.5" opacity="0.85"/>
  <!-- Embedded protostars inside the mountain ridge -->
  <g fill="#ffe2a8">
    <circle cx="242" cy="338" r="2.2"/><circle cx="435" cy="296" r="2.5"/><circle cx="645" cy="268" r="2.3"/>
    <circle cx="515" cy="382" r="1.8"/><circle cx="132" cy="410" r="2"/>
  </g>
  <!-- Signature JWST 6-point diffraction spikes -->
  <g stroke="#fff1cc" stroke-width="1.3">
    <g transform="translate(655,44)">
      <line x1="0" y1="-16" x2="0" y2="16"/><line x1="-14" y1="-8" x2="14" y2="8"/><line x1="-14" y1="8" x2="14" y2="-8"/>
      <circle cx="0" cy="0" r="2.6" fill="#ffffff" stroke="none"/>
    </g>
    <g transform="translate(412,45)">
      <line x1="0" y1="-13" x2="0" y2="13"/><line x1="-11.5" y1="-6.5" x2="11.5" y2="6.5"/><line x1="-11.5" y1="6.5" x2="11.5" y2="-6.5"/>
      <circle cx="0" cy="0" r="2.1" fill="#ffffff" stroke="none"/>
    </g>
    <g transform="translate(165,40)">
      <line x1="0" y1="-12" x2="0" y2="12"/><line x1="-10.5" y1="-6" x2="10.5" y2="6"/><line x1="-10.5" y1="6" x2="10.5" y2="-6"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff" stroke="none"/>
    </g>
  </g>
</svg>
