<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="irBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030916"/>
      <stop offset="50%" stop-color="#08162d"/>
      <stop offset="100%" stop-color="#170b14"/>
    </linearGradient>
    <radialGradient id="irCore" cx="42%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#ff9944" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#6b325c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#040a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irPillar1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f7b267" stop-opacity="0.88"/>
      <stop offset="22%" stop-color="#b85a2a" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#4e2324" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1c1423" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="irPillar2" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#e8984c" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#7c3626" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#1b1422" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="irBlur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="irGlow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#irBg)"/>
  <rect width="800" height="500" fill="url(#irCore)"/>
  <!-- Dense infrared background starfield piercing the dust -->
  <g fill="#ffe6c7">
    <circle cx="35" cy="30" r="1.2"/><circle cx="72" cy="84" r="1.6"/><circle cx="115" cy="42" r="1.1"/>
    <circle cx="148" cy="112" r="1.8"/><circle cx="195" cy="65" r="1.2"/><circle cx="240" cy="34" r="1.5"/>
    <circle cx="285" cy="58" r="1.1"/><circle cx="348" cy="28" r="1.9"/><circle cx="395" cy="88" r="1.3"/>
    <circle cx="440" cy="44" r="1.5"/><circle cx="512" cy="70" r="1.2"/><circle cx="566" cy="32" r="1.7"/>
    <circle cx="618" cy="96" r="1.3"/><circle cx="670" cy="48" r="1.6"/><circle cx="745" cy="72" r="1.9"/>
    <circle cx="58" cy="162" r="1.3"/><circle cx="108" cy="215" r="1.5"/><circle cx="164" cy="260" r="1.1"/>
    <circle cx="62" cy="345" r="1.7"/><circle cx="122" cy="410" r="1.2"/><circle cx="645" cy="158" r="1.4"/>
    <circle cx="705" cy="212" r="1.8"/><circle cx="760" cy="165" r="1.2"/><circle cx="688" cy="296" r="1.5"/>
    <circle cx="742" cy="368" r="1.3"/><circle cx="662" cy="422" r="1.7"/><circle cx="540" cy="148" r="1.3"/>
    <circle cx="385" cy="195" r="1.2"/><circle cx="565" cy="240" r="1.4"/><circle cx="345" cy="320" r="1.1"/>
  </g>
  <!-- Translucent Dust Pillars in Near-Infrared -->
  <path d="M180,500 C188,410 198,320 220,245 C235,195 258,150 285,112 C304,88 332,96 338,125 C346,162 325,205 338,248 C355,305 368,405 375,500 Z" fill="url(#irPillar1)"/>
  <path d="M368,500 C376,430 392,350 412,288 C428,240 448,195 478,180 C500,170 516,192 512,222 C505,270 492,332 505,395 L515,500 Z" fill="url(#irPillar2)"/>
  <path d="M525,500 C535,435 552,368 580,322 C598,295 620,295 630,322 C638,352 630,425 636,500 Z" fill="url(#irPillar2)"/>
  <!-- Stars visible THROUGH the translucent IR pillars -->
  <g fill="#ffd29d" opacity="0.78">
    <circle cx="268" cy="290" r="1.3"/><circle cx="295" cy="340" r="1.6"/><circle cx="242" cy="410" r="1.2"/>
    <circle cx="448" cy="325" r="1.4"/><circle cx="472" cy="400" r="1.2"/><circle cx="585" cy="395" r="1.3"/>
  </g>
  <!-- Crimson newborn protostars glowing inside pillar tips -->
  <g fill="#ff3b2f">
    <circle cx="296" cy="116" r="5" filter="url(#irBlur)"/>
    <circle cx="322" cy="138" r="4" filter="url(#irBlur)"/>
    <circle cx="484" cy="186" r="5.5" filter="url(#irBlur)"/>
    <circle cx="606" cy="316" r="4.5" filter="url(#irBlur)"/>
  </g>
  <g fill="#ffbfa8">
    <circle cx="296" cy="116" r="2.2"/><circle cx="322" cy="138" r="1.8"/>
    <circle cx="484" cy="186" r="2.4"/><circle cx="606" cy="316" r="2"/>
  </g>
  <!-- JWST signature 6-point hexagonal diffraction spikes on bright IR stars -->
  <g stroke="#ffe7ba" stroke-width="1.3" opacity="0.95">
    <g transform="translate(745,72)">
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="-14" y1="-8" x2="14" y2="8"/>
      <line x1="-14" y1="8" x2="14" y2="-8"/>
      <circle cx="0" cy="0" r="2.6" fill="#fff6e0" stroke="none"/>
    </g>
    <g transform="translate(148,112)">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-12" y1="-7" x2="12" y2="7"/>
      <line x1="-12" y1="7" x2="12" y2="-7"/>
      <circle cx="0" cy="0" r="2.2" fill="#fff6e0" stroke="none"/>
    </g>
    <g transform="translate(566,32)">
      <line x1="0" y1="-11" x2="0" y2="11"/>
      <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/>
      <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5"/>
      <circle cx="0" cy="0" r="1.8" fill="#fff6e0" stroke="none"/>
    </g>
  </g>
</svg>
