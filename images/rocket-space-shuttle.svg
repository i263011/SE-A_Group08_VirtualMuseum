<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010814"/>
      <stop offset="65%" stop-color="#041E42"/>
      <stop offset="100%" stop-color="#173561"/>
    </linearGradient>
    <linearGradient id="etOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c3b15"/>
      <stop offset="40%" stop-color="#d66a29"/>
      <stop offset="85%" stop-color="#aa491a"/>
      <stop offset="100%" stop-color="#6b290d"/>
    </linearGradient>
    <linearGradient id="srbWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8b0bc"/>
      <stop offset="45%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#7c8594"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky2)"/>
  <g fill="#f0cb90" opacity="0.65"><circle cx="55" cy="95" r="1.4"/><circle cx="345" cy="75" r="1.6"/><circle cx="320" cy="240" r="1.3"/></g>
  <rect x="0" y="545" width="400" height="55" fill="#081326"/>
  <line x1="0" y1="545" x2="400" y2="545" stroke="#BC9E70" stroke-width="2"/>
  <!-- External Tank (Orange) -->
  <path d="M168,145 C168,95 200,72 200,72 C200,72 232,95 232,145 L232,485 L168,485 Z" fill="url(#etOrange)"/>
  <!-- Twin Solid Rocket Boosters -->
  <g>
    <polygon points="145,175 157,138 169,175" fill="url(#srbWhite)"/>
    <rect x="145" y="175" width="24" height="338" fill="url(#srbWhite)"/>
    <rect x="145" y="210" width="24" height="8" fill="#1f2530"/>
    <polygon points="142,513 172,513 176,544 138,544" fill="#464d59"/>
    <polygon points="231,175 243,138 255,175" fill="url(#srbWhite)"/>
    <rect x="231" y="175" width="24" height="338" fill="url(#srbWhite)"/>
    <rect x="231" y="210" width="24" height="8" fill="#1f2530"/>
    <polygon points="228,513 258,513 262,544 224,544" fill="#464d59"/>
  </g>
  <!-- Orbiter Delta Wings & Fuselage -->
  <polygon points="200,295 110,475 110,502 290,502 290,475" fill="#e8edf5" stroke="#18202c" stroke-width="4"/>
  <path d="M180,275 C180,235 200,210 200,210 C200,210 220,235 220,275 L220,502 L180,502 Z" fill="url(#srbWhite)"/>
  <!-- Cockpit Windows & Nose Cap -->
  <path d="M192,226 C196,214 204,214 208,226 Z" fill="#18202c"/>
  <polygon points="187,255 213,255 210,245 190,245" fill="#1c2a3a"/>
  <!-- Vertical Tail Stabilizer -->
  <rect x="197" y="410" width="6" height="92" fill="#d3dae6" stroke="#18202c" stroke-width="1"/>
  <!-- 3 RS-25 Main Engines -->
  <g fill="#454d59">
    <polygon points="183,502 193,502 195,522 181,522"/>
    <polygon points="195,502 205,502 207,522 193,522"/>
    <polygon points="207,502 217,502 219,522 205,522"/>
